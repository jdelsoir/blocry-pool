<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'self'">
<title>Blocry Pool</title>
<meta name="theme-color" content="#3CABE1">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<style>
  :root{--bg:#F5F6F6;--ink:#3E3E3D;--muted:#6F6F6D;--c50:#3CABE1;--c50ink:#1C7FB4;color-scheme:light dark}
  @media (prefers-color-scheme:dark){:root{--bg:#14181B;--ink:#E9EBEC;--muted:#9BA4A9;--c50:#4FB8EA;--c50ink:#7CCBF1}}
  body{font:15px/1.5 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;min-height:100dvh;margin:0;padding:16px;box-sizing:border-box;background:var(--bg);color:var(--ink)}
  .card{text-align:center;max-width:26rem}
  img{width:64px;height:64px}
  h1{font:800 italic 1.5rem/1.1 "Exo 2","Trebuchet MS",system-ui,sans-serif;text-transform:uppercase;color:var(--c50ink);margin:.6rem 0 .4rem}
  p{margin:.3rem 0;color:var(--muted)}
  a{display:inline-block;margin-top:1rem;padding:.6rem 1.2rem;border-radius:6px;background:var(--c50);color:#fff;font-weight:700;text-decoration:none}
</style></head>
<body><div class="card">
  <img src="icons/favicon.svg" alt="">
  <h1>Hors ligne</h1>
  <p>Blocry Pool ne peut pas joindre le réseau pour le moment.</p>
  <p lang="en">You are offline. Blocry Pool cannot reach the network right now.</p>
  <a href="./">Réessayer / Retry</a>
</div></body></html>
