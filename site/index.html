<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Blocry Pool</title>
<meta name="description" content="Couloirs libres à la piscine de Blocry (Louvain-la-Neuve), application non officielle. Lane availability at the Blocry pool, unofficial app.">
<meta name="theme-color" content="#3CABE1">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blocry Pool">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;1,800&family=Teko:wght@500;600&family=Open+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <header class="appbar">
    <div class="appbar-in">
      <h1 class="name"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="3.5" width="21" height="19" rx="5" fill="var(--c50)"/><path d="M6.5 10.5H8.5M11 10.5H13M15.5 10.5H17.5M6.5 16.5H8.5M11 16.5H13M15.5 16.5H17.5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="19.5" cy="4.5" r="3.6" fill="var(--now)"/></svg><span id="title">Agenda</span></h1>
      <div class="seg lang" role="group" id="langs" aria-label="Langue">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <main class="main" id="main" tabindex="-1">
    <div class="loading" id="loading">Chargement...</div>
    <noscript><div class="empty-day">Cette application a besoin de JavaScript. This app needs JavaScript.</div></noscript>
  </main>
  <nav class="tabs" id="tabs" aria-label="Menu">
    <div class="tabs-in">
      <button type="button" class="tab" data-tab="agenda" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>Agenda</span></button>
      <button type="button" class="tab" data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 9v12M15 9v12"/></svg><span>Semaine</span></button>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <div class="bsheet" id="bsheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
</div>
</body>
</html>
